[project]
name = "duckdb-sqlalchemy"
version = "1.5.5.11"
description = "DuckDB SQLAlchemy dialect for DuckDB and MotherDuck"
authors = [
    {name = "Leonardo Vida", email = "lleonardovida@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10,<4"
readme = "README.md"
keywords = ["duckdb", "sqlalchemy", "motherduck", "database", "analytics", "olap", "dialect"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "duckdb>=1.3.0",
    "sqlalchemy>=2.0.0; python_version < '3.14'",
    "sqlalchemy>=2.0.45; python_version >= '3.14'",
    "packaging>=21",
    # DuckDB imports pytz at runtime to return TIMESTAMPTZ values.
    "pytz>=2024.2",
]

[project.urls]
"Bug Tracker" = "https://github.com/leonardovida/duckdb-sqlalchemy/issues"
Changelog = "https://github.com/leonardovida/duckdb-sqlalchemy/releases"
Documentation = "https://leonardovida.github.io/duckdb-sqlalchemy/"
repository = "https://github.com/leonardovida/duckdb-sqlalchemy"
Upstream = "https://github.com/Mause/duckdb_engine"

[project.optional-dependencies]
dev = [
    "numpy>=1.26,<3.0; python_version < '3.13'",
    "numpy>=2.0,<3.0; python_version >= '3.13'",
    "nox>=2026.4.10,<2027.0.0",
    "pyarrow>=22.0.0; python_version >= '3.10'",
    "pytest>=8.0.0,<10.0.0",
    "ty==0.0.80",
    "hypothesis>=6.75.2,<7.0.0",
    "pandas>=2.2,<4.0",
    "ipython>=8.0",
    "jupysql>=0.11.1,<0.12.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-remotedata>=0.4.0,<0.5.0",
    "pytest-snapshot>=0.9.0,<1.0.0",
    "fsspec>=2025.2.0,<2027.0.0",
]
devtools = [
    "nox>=2026.4.10,<2027.0.0",
    "pdbpp>=0.11.0,<0.13.0",
    "pre-commit>=4.6.0,<4.7.0; python_version >= '3.10'",
]

[project.entry-points."sqlalchemy.dialects"]
duckdb = "duckdb_sqlalchemy:Dialect"
"duckdb.duckdb_sqlalchemy" = "duckdb_sqlalchemy:Dialect"

[tool.pytest.ini_options]
addopts = "--hypothesis-show-statistics --strict --strict-markers"
xfail_strict = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ['E203', 'E501']

[tool.hatch.build.targets.wheel]
packages = ["duckdb_sqlalchemy"]
exclude = ["duckdb_sqlalchemy/tests", "duckdb_sqlalchemy/conftest.py"]

[tool.hatch.build.targets.sdist]
include = [
    "/duckdb_sqlalchemy",
    "/README.md",
    "/LICENSE.txt",
    "/CHANGELOG.md",
    "/noxfile.py",
    "/test.cfg",
]

[build-system]
requires = ["hatchling>=1.22.0"]
build-backend = "hatchling.build"
