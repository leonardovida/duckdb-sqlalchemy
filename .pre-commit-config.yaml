exclude: .*\.snap
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-ast
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-case-conflict
      - id: check-toml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ty
        name: ty
        # Runs in the locked dev environment so imports resolve.
        entry: uv run --locked --extra dev ty check
        language: system
        files: ^duckdb_sqlalchemy/(?!tests/).*\.py$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: 'v0.16.9'
    hooks:
      - id: ruff-check
        args:
         - --fix
         - --exit-non-zero-on-fix
      - id: ruff-format
        types_or: [python, pyi]
