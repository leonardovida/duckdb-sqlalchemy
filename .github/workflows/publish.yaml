name: Publish Python package
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [pyproject.toml, CHANGELOG.md]
  pull_request:
    paths:
      - .github/workflows/publish.yaml

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  validate-workflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate workflow syntax and expressions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -shellcheck= .github/workflows/publish.yaml

  build:
    name: Build distributions
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
    outputs:
      publish: ${{ steps.candidate.outputs.publish }}
      version: ${{ steps.candidate.outputs.version }}
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check release candidate
        id: candidate
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+)+", version):
              raise SystemExit("A stable numeric package version is required")
          publish = True
          if os.environ["EVENT_NAME"] == "release":
              if os.environ["RELEASE_TAG"] != f"v{version}":
                  raise SystemExit("Release tag does not match the package version")
          else:
              previous = tomllib.loads(subprocess.check_output(
                  ["git", "show", "HEAD^:pyproject.toml"], text=True
              ))["project"]["version"]
              publish = version != previous
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"publish={str(publish).lower()}\nversion={version}\nsha={sha}\n")
          PY
      - name: Require successful checks on the exact release commit
        if: steps.candidate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          required = {"tests_passed", "pre-commit", "ty"}
          url = (f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
                 f"/commits/{os.environ['RELEASE_SHA']}/check-runs?per_page=100")
          for attempt in range(90):
              request = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request) as response:
                  checks = json.load(response)["check_runs"]
              latest = {}
              for check in checks:
                  if check["app"]["slug"] == "github-actions" and check["name"] in required:
                      existing = latest.get(check["name"])
                      if existing is None or check["id"] > existing["id"]:
                          latest[check["name"]] = check
              failed = [name for name, check in latest.items()
                        if check["status"] == "completed" and check["conclusion"] != "success"]
              if failed:
                  raise SystemExit(f"Release checks failed: {failed}")
              if required <= latest.keys() and all(
                  check["conclusion"] == "success" for check in latest.values()
              ):
                  print("All required checks passed on the release commit")
                  break
              print(f"Waiting for release checks ({attempt + 1}/90)", flush=True)
              time.sleep(10)
          else:
              raise SystemExit("Timed out waiting for required release checks")
          PY
      - name: Install build tooling
        if: steps.candidate.outputs.publish == 'true'
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist and wheel
        if: steps.candidate.outputs.publish == 'true'
        run: python -m build
      - name: Check distributions
        if: steps.candidate.outputs.publish == 'true'
        run: python -m twine check --strict dist/*
      - name: Smoke test the wheel
        if: steps.candidate.outputs.publish == 'true'
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -I scripts/verify_distribution.py
      - name: Upload distributions
        if: steps.candidate.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/duckdb-sqlalchemy
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  verify-published:
    name: Verify published package
    needs: [build, pypi-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Verify PyPI artifact hashes
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          url = f"https://pypi.org/pypi/duckdb-sqlalchemy/{os.environ['RELEASE_VERSION']}/json"
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(url) as response:
                      metadata = json.load(response)
                  remote = {item["filename"]: item["digests"]["sha256"]
                            for item in metadata["urls"]}
                  local = {path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                           for path in Path("dist").iterdir() if path.is_file()}
                  if len(local) == 2 and local == remote:
                      print("Published wheel and sdist hashes match the tested artifacts")
                      break
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              time.sleep(5)
          else:
              raise SystemExit("PyPI artifacts missing or hashes differ")
          PY
      - name: Smoke test a fresh PyPI wheel with Arrow and pandas
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv /tmp/published
          /tmp/published/bin/pip install --no-cache-dir --only-binary=:all: "duckdb-sqlalchemy==$RELEASE_VERSION" pyarrow pandas
          /tmp/published/bin/python -I scripts/verify_distribution.py

  github-release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [build, verify-published]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Extract release notes from the changelog
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          heading = f"## [{version}]("
          changelog = Path("CHANGELOG.md").read_text()
          sections = changelog.split(heading, 1)
          if len(sections) != 2:
              raise SystemExit("Release notes are missing from CHANGELOG.md")
          notes = sections[1].split("\n", 1)[1].split("\n## ", 1)[0].strip()
          if not notes:
              raise SystemExit("Release notes are empty")
          Path("/tmp/release-notes.md").write_text(notes + "\n")
          PY
      - name: Create release and attach verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          gh release create "v$RELEASE_VERSION" dist/* --target "$RELEASE_SHA" --title "duckdb-sqlalchemy $RELEASE_VERSION" --notes-file /tmp/release-notes.md --latest

  github-release-notes:
    name: Update GitHub release notes
    if: github.event_name == 'push' && needs.build.outputs.publish == 'false'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - name: Extract release notes from the changelog
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          heading = f"## [{version}]("
          changelog = Path("CHANGELOG.md").read_text()
          sections = changelog.split(heading, 1)
          if len(sections) != 2:
              raise SystemExit("Release notes are missing from CHANGELOG.md")
          notes = sections[1].split("\n", 1)[1].split("\n## ", 1)[0].strip()
          if not notes:
              raise SystemExit("Release notes are empty")
          if ";" in notes:
              raise SystemExit("Release notes must not contain semicolons")
          Path("/tmp/release-notes.md").write_text(notes + "\n")
          PY
      - name: Update the existing release description
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: gh release edit "v$RELEASE_VERSION" --notes-file /tmp/release-notes.md
