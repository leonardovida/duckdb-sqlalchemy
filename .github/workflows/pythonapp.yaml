name: Python application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_backend:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    env:
      FORCE_COLOR: 1

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Remove cached duckdb extensions
        run: rm -rf ~/.duckdb
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install --upgrade SQLAlchemy
          python -m pip install --upgrade duckdb
      - name: Run tests
        run: |
          pytest \
            --junitxml=results.xml \
            --cov \
            --cov-report xml:coverage.xml \
            --verbose \
            -rs \
            --remote-data
      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: results.xml
          comment_mode: off
          check_name:  "Test Results - python=${{ matrix.python }}"
      - uses: codecov/codecov-action@v7.1.1
        env:
          PYTHON: ${{matrix.python}}
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: PYTHON
          # Dependabot PRs cannot read the Actions CODECOV_TOKEN secret
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}
          use_pypi: true
          verbose: true

  minimum_versions:
    # Keep in sync with the dependency floors in pyproject.toml.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install minimum supported versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "SQLAlchemy==2.0.0" "duckdb==1.3.0"
      - name: Run tests
        run: pytest -q -rs

  sqlalchemy_2_0:
    # build_backend picks SQLAlchemy 2.1 on Python 3.11+, so test 2.0 there too.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            sqlalchemy: "SQLAlchemy<2.1"
          # the SQLAlchemy floor for Python 3.14 in pyproject.toml
          - python: "3.14"
            sqlalchemy: "SQLAlchemy==2.0.45"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install SQLAlchemy 2.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "${{ matrix.sqlalchemy }}"
      - name: Run tests
        run: pytest -q -rs

  sqlalchemy_prerelease:
    # Informational: upstream prerelease regressions do not block merges.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install SQLAlchemy prerelease
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install --pre --upgrade SQLAlchemy
      - name: Run SQLAlchemy prerelease tests
        run: pytest -q

  duckdb_prerelease:
    # Informational: upstream nightly regressions do not block merges.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install DuckDB prerelease
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install --pre --upgrade duckdb
      - name: Run DuckDB prerelease tests
        run: pytest -q

  platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q -m "not remote_data"

  upstream_suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sqlalchemy: ["SQLAlchemy>=2.0,<2.1", "SQLAlchemy>=2.1,<2.2"]
    env:
      DUCKDB_SQLA_SUITE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install "${{ matrix.sqlalchemy }}"
      - run: |
          pytest -q duckdb_sqlalchemy/tests/sqlalchemy_suite --dburi duckdb:///sqlalchemy_suite.duckdb -r fE --maxfail=40 -o strict_parametrization_ids=false

  distributions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        artifact: [wheel, sdist]
        optional: [none, arrow, pandas]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install distribution with selected optional dependency
        env:
          ARTIFACT: ${{ matrix.artifact }}
          OPTIONAL: ${{ matrix.optional }}
        run: |
          if [ "$ARTIFACT" = wheel ]; then
            python -m pip install dist/*.whl
          else
            python -m pip install dist/*.tar.gz
          fi
          if [ "$OPTIONAL" = arrow ]; then python -m pip install pyarrow; fi
          if [ "$OPTIONAL" = pandas ]; then python -m pip install pandas; fi
      - run: python -I scripts/verify_distribution.py

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/checkout@v7
        with:
          ref: 6b41e798d7525a94176ada4e6a7ac1cb3d648df3
          path: .benchmark-baseline
          persist-credentials: false
      - run: python -m pip install -e ".benchmark-baseline[dev]"
      - run: python benchmarks/run.py --baseline --cases startup native_insert core_insert bulk_insert pandas_insert tuple_read arrow_read reflection --rows 10000 --repeats 2 --output baseline.json
      - run: python -m pip install -e ".[dev]"
      - run: python benchmarks/run.py --rows 10000 --repeats 2 --output benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmark.json
            baseline.json

  tests_passed:
    # Single status check to require in branch rules.
    if: always()
    needs: [build_backend, minimum_versions, sqlalchemy_2_0, platforms, upstream_suite, distributions, benchmarks]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
