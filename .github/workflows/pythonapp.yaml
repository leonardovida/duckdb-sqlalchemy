name: Python application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_backend:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    env:
      FORCE_COLOR: 1

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Remove cached duckdb extensions
        run: rm -rf ~/.duckdb
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install --upgrade SQLAlchemy
          python -m pip install --upgrade duckdb
      - name: Run tests
        run: |
          pytest \
            --junitxml=results.xml \
            --cov \
            --cov-report xml:coverage.xml \
            --verbose \
            -rs \
            --remote-data
      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: results.xml
          comment_mode: off
          check_name:  "Test Results - python=${{ matrix.python }}"
      - uses: codecov/codecov-action@v7.1.1
        env:
          PYTHON: ${{matrix.python}}
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: PYTHON
          fail_ci_if_error: true
          use_pypi: true
          verbose: true

  minimum_versions:
    # Keep in sync with the dependency floors in pyproject.toml.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install minimum supported versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "SQLAlchemy==2.0.0" "duckdb==1.3.0"
      - name: Run tests
        run: pytest -q -rs

  sqlalchemy_prerelease:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install SQLAlchemy prerelease
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install --pre --upgrade SQLAlchemy
      - name: Run SQLAlchemy prerelease tests
        run: pytest -q

  duckdb_prerelease:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install DuckDB prerelease
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install --pre --upgrade duckdb
      - name: Run DuckDB prerelease tests
        run: pytest -q

  tests_passed:
    # Single status check to require in branch rules.
    if: always()
    needs: [build_backend, minimum_versions, sqlalchemy_prerelease, duckdb_prerelease]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
