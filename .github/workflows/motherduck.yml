name: MotherDuck integration
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      MOTHERDUCK_TEST_DATABASE: ${{ vars.MOTHERDUCK_TEST_DATABASE }}
      MOTHERDUCK_DUCKDB_VERSION: ${{ vars.MOTHERDUCK_DUCKDB_VERSION }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Explain missing credentials
        if: env.MOTHERDUCK_TOKEN == ''
        run: echo "::notice::MotherDuck integration was not run. Configure MOTHERDUCK_TOKEN to enable it."
      - name: Install dependencies
        if: env.MOTHERDUCK_TOKEN != ''
        run: |
          python -m pip install -e ".[dev]"
          if [ -n "$MOTHERDUCK_DUCKDB_VERSION" ]; then
            python -m pip install "duckdb==$MOTHERDUCK_DUCKDB_VERSION"
          fi
      - name: Test real service connection
        if: env.MOTHERDUCK_TOKEN != ''
        run: pytest -q duckdb_sqlalchemy/tests/test_integration.py -k motherduck --remote-data -rs
